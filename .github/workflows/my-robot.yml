name: My First DevOps Robot

on: [push]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Привет, будущий DevOps инженер! Твой робот запущен."
      - name: Show Date
        run: date

second_job:
    runs-on: ubuntu-latest
    needs: greet
    steps:
      - name: Final Step
        run: echo "Первая задача прошла успешно, поэтому запустился я!"
